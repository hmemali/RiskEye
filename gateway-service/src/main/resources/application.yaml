spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: account-service
          uri: lb://account-service
          predicates:
            - Path=/api/accounts/**

        - id: authen-service
          uri: lb://authen-service
          predicates:
            - Path=/api/auth/**

        - id: eureka-service
          uri: lb://eureka-service
          predicates:
            - Path=/eureka-dashboard/**
          filters:
            - StripPrefix=1

server:
  port: 8090

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true