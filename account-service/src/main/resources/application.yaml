spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://localhost:5432/account_db}
    username: ${DB_USERNAME:pfe_user}
    password: ${DB_PASSWORD:pfe_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8081

security:
  jwt:
    secret: ${JWT_SECRET}

account:
  service:
    api-key: ${ACCOUNT_SERVICE_API_KEY:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
instance:
        prefer-ip-address: true