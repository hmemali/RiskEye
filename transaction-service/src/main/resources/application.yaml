spring:
  application:
    name: transaction-service

  datasource:
    url: ${TRANSACTION_DB_URL:jdbc:postgresql://localhost:5432/transaction_db}
    username: ${DB_USERNAME:pfe_user}
    password: ${DB_PASSWORD:pfe_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

fraud:
  max-daily-transactions: 3
  amount-threshold: 5000
  time-zone: Africa/Tunis
  notification:
    relay-delay-ms: 10000
    max-attempts: 10

notification:
  service:
    api-key: ${NOTIFICATION_API_KEY:}

account:
  service:
    api-key: ${ACCOUNT_SERVICE_API_KEY:}

security:
  jwt:
    secret: ${JWT_SECRET:ma_cle_de_dev_tres_longue_au_moins_32_caracteres}

auth:
  service:
    api-key: ${AUTH_SERVICE_API_KEY:}